<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Analysis · ML App Client Reference</title><link rel="stylesheet" href="module.css"></head><body><main id="reference"></main>
<script>
window.MLAPP_REFERENCE={
title:"Analysis",eyebrow:"Full-dataset analytics",
intro:"Submit descriptive profiling, visualizations and trends, and time-series diagnostics through the platform API. The client never downloads source tables or computes analysis locally: it receives compact aggregates, bounded display points, and server-fitted curves.",
concepts:[
{title:"Explicit full scans",text:"Descriptive profiling and temporal diagnostics execute asynchronously only after an explicit request."},
{title:"Bounded visual output",text:"Charts scan all matching rows server-side, then return capped aggregates, points, and trend curves."},
{title:"Readable results",text:"The profile view includes platform-returned numeric histograms and top-category bar cards; visualization SVG uses only bounded points returned by the API."},
{title:"Scope",text:"Data Roles and record browsing are intentionally not part of this first Analysis module."}],
values:[
{name:"dataset",summary:"a concrete Dataset instance or immutable version ID",rows:[["Dataset or str","Every analysis method accepts either the typed Dataset object or its concrete version ID."]]},
{name:"profile options",summary:"full-scan descriptive profiling",rows:[["target_type / comparison_type","categorical or continuous."],["row_limit","100–1,000,000; bounds retained graphic source points only, never full-scan statistics."],["max_target_features","1–500 returned relation features."],["max_segment_features","2–20 eligible segment dimensions."]]},
{name:"include_* profile switches",summary:"choose report sections; all default to true",rows:[["include_summary","Returns dataset-level dataQualityNotes. Turn off only when the quality-guidance section is not needed."],["include_univariate","Builds detailed per-column profiles: median, standard deviation, mode, top values, examples, numeric histogram data, and category-share aggregates."],["include_target_relations","Calculates comparison-column versus feature relations. It produces no relations until comparison_column is supplied."],["include_segments","Runs the multivariate segment scan. It produces no segment result until target_column is supplied."],["include_graphic_summaries","Returns histogram, density, and scatter graphic contracts. It does not reduce the full-dataset scan; set it true together with include_univariate to display numeric distributions in the client report. Category cards use full-data top-value aggregates from the univariate profile."]]},
{name:"visualizations",summary:"server-side chart contracts",rows:[["kind","line, bar, scatter, histogram, boxplot, kpi, projection, time_series, autocorrelation, lag_relationship."],["aggregations","average, median, std, sum, count, min, max."],["trend","none, linear, spline, polynomial, exponential. Spline is marked approximate by the platform."],["max_points / bins","50–10,000 display points; 20–200 bins. They bound results, not analysis scope."]]},
{name:"time series",summary:"asynchronous temporal diagnostics",rows:[["max_lag","1–120."],["seasonal_period","0–10,000; 0 leaves period unspecified."],["rolling_window","2–200."],["max_points","100–2,000 returned display points."]]},
{name:"job status",summary:"profile and time-series lifecycle",rows:[["queued","Accepted and waiting for a platform worker."],["running","Platform worker is processing the full relation."],["completed","The compact result is attached to job status."],["failed","wait_* raises ApiError with platform error detail."]]}],
sections:[
{title:"Descriptive profiling",methods:[
{name:"start_descriptive_profile",summary:"Queue a full-dataset descriptive profile.",description:"Returns DescriptiveProfileJob. Configure exactly which report sections the platform should calculate; all include_* switches default to true.",args:[["dataset","Dataset instance or ID."],["target_column, target_type","Required only for target-oriented relations and the segment scan."],["comparison_column, comparison_type","Required only for include_target_relations; comparison_column selects the variable compared with features."],["include_summary","Default true. Returns dataset-level data-quality notes."],["include_univariate","Default true. Returns detailed column profiles; keep true for distributions."],["include_target_relations","Default true, but does no work without comparison_column."],["include_segments","Default true, but does no work without target_column."],["include_graphic_summaries","Default true. Keep true with include_univariate to return histogram data for the client report."],["row_limit, max_target_features, max_segment_features","Server-side bounded result controls; row_limit never changes the full-scan statistic scope."]],example:"# Recommended univariate report with numeric distributions.\njob = client.start_descriptive_profile(\n    dataset,\n    include_summary=True,\n    include_univariate=True,\n    include_target_relations=False,\n    include_segments=False,\n    include_graphic_summaries=True,\n)\nprofile = client.wait_for_descriptive_profile(job)\nclient.display_descriptive_profile(profile)",api:"POST /api/v1/datasets/{dataset_id}/descriptive-profile\n{\n  \"include_summary\": true,\n  \"include_univariate\": true,\n  \"include_target_relations\": false,\n  \"include_segments\": false,\n  \"include_graphic_summaries\": true\n}"},
{name:"get_descriptive_profile_status",summary:"Read current profile-job status.",description:"Returns compact job state and its aggregate result after completion.",args:[["job","DescriptiveProfileJob from start_descriptive_profile."]],example:"current = client.get_descriptive_profile_status(job)",api:"GET /api/v1/datasets/{dataset_id}/descriptive-profile/{job_id}"},
{name:"wait_for_descriptive_profile",summary:"Poll a profile job to completion.",description:"Returns DescriptiveProfile; raises TimeoutError or ApiError when no completed result is available.",args:[["job","Job to poll."],["poll_interval","Seconds between status calls; default 2."],["timeout","Optional overall timeout in seconds."],["on_update","Optional callback after each polling update."]],example:"profile = client.wait_for_descriptive_profile(job, timeout=3600)\nclient.display_descriptive_profile(profile)",api:"GET /api/v1/datasets/{dataset_id}/descriptive-profile/{job_id}\n# Repeated by the client until completed or failed."},
{name:"profile_dataset",summary:"Start and wait for a complete profile.",description:"Client-side convenience workflow composing start_descriptive_profile and wait_for_descriptive_profile. Use the explicit include_* switches to make the requested report scope obvious.",args:[["dataset","Dataset instance or ID."],["**options","Any start_descriptive_profile option, including every include_* switch."]],example:"profile = client.profile_dataset(\n    dataset,\n    include_summary=True,\n    include_univariate=True,\n    include_target_relations=False,\n    include_segments=False,\n    include_graphic_summaries=True,\n)\nclient.display_descriptive_profile(profile)",api:null}]},
{title:"Visualizations and trends",methods:[
{name:"visualize_dataset",summary:"Render one bounded, full-data visualization.",description:"The platform scans the complete relation and returns chart data, trend fits, scanned-row count, and truncation/approximation flags.",args:[["dataset, kind","Dataset and requested visualization kind."],["x, y, group, aggregations","Axes, optional series dimension, and metrics."],["selected_groups","Optional explicit group selection."],["x_epsilon, y_epsilon","Optional numeric bucketing widths."],["trend, polynomial_degree","Server-side scatter trend and degree 2–5."],["max_points, bins","Bounded display-data controls."],["feature_columns, target_column, reduction_method","PCA projection setup."],["max_lag, rolling_window, driver_column","Time-series chart settings."]],example:"chart = client.visualize_dataset(\n    dataset, kind=\"scatter\", x=\"tenure\", y=\"monthly_spend\",\n    group=\"segment\", trend=\"linear\", max_points=2000,\n)\nclient.display_visualization(chart)",api:"POST /api/v1/datasets/{dataset_id}/visualization\n{\"kind\":\"scatter\",\"x\":\"tenure\",\"y\":\"monthly_spend\",\"trend\":\"linear\",\"max_points\":2000}"},
{name:"visualization_group_values",summary:"Read bounded full-data group choices.",description:"Returns selectable visualization values, not raw records.",args:[["dataset","Dataset instance or ID."],["column","Grouping column."],["limit","1–1,000; default 100."]],example:"groups = client.visualization_group_values(dataset, \"segment\", limit=100)\nprint(groups[\"values\"])",api:"POST /api/v1/datasets/{dataset_id}/visualization/groups\n{\"column\":\"segment\",\"limit\":100}"}]},
{title:"Time-series diagnostics",methods:[
{name:"start_time_series_analysis",summary:"Queue complete temporal diagnostics.",description:"Queues platform-side cadence, ACF, seasonal, decomposition, and driver analyses over all selected rows.",args:[["dataset","Dataset instance or ID."],["time_column, value_column","Required temporal and numeric-measure columns."],["max_lag, seasonal_period, rolling_window, max_points","Analysis and bounded-display options."],["driver_column, driver_columns","Optional driver signals."]],example:"job = client.start_time_series_analysis(\n    dataset, time_column=\"event_time\", value_column=\"revenue\",\n    driver_columns=[\"campaign_spend\"],\n)",api:"POST /api/v1/datasets/{dataset_id}/time-series-analysis\n{\"time_column\":\"event_time\",\"value_column\":\"revenue\",\"max_lag\":48}"},
{name:"get_time_series_analysis_status",summary:"Read current temporal-job status.",description:"Returns compact state and its completed temporal result when available.",args:[["job","TimeSeriesAnalysisJob from start_time_series_analysis."]],example:"current = client.get_time_series_analysis_status(job)",api:"GET /api/v1/datasets/{dataset_id}/time-series-analysis/{job_id}"},
{name:"wait_for_time_series_analysis",summary:"Poll temporal diagnostics to completion.",description:"Returns TimeSeriesAnalysis; raises TimeoutError or ApiError on timeout or failure.",args:[["job","Job to poll."],["poll_interval, timeout, on_update","Same polling controls as wait_for_descriptive_profile."]],example:"diagnostics = client.wait_for_time_series_analysis(job, timeout=3600)\nclient.display_time_series_analysis(diagnostics)",api:"GET /api/v1/datasets/{dataset_id}/time-series-analysis/{job_id}\n# Repeated by the client until completed or failed."},
{name:"analyze_time_series",summary:"Start and wait for temporal diagnostics.",description:"Client-side convenience workflow composing start_time_series_analysis and wait_for_time_series_analysis.",args:[["dataset","Dataset instance or ID."],["**options","Any start_time_series_analysis option."]],example:"diagnostics = client.analyze_time_series(dataset, time_column=\"event_time\", value_column=\"revenue\")",api:null}]},
{title:"Result presentation",methods:[
{name:"present_descriptive_profile",summary:"Build a rich univariate profile view.",description:"Returns DescriptiveProfilePresentation with quality guidance, numeric histograms, top-category share cards, and a compact column table. No HTTP request is made.",args:[["result","Completed DescriptiveProfile with include_univariate enabled; enable include_graphic_summaries for numeric histograms."]],example:"view = client.present_descriptive_profile(profile)\ndisplay(view)",api:null},
{name:"display_descriptive_profile",summary:"Display the profile view.",description:"Uses IPython display when available; otherwise prints its terminal representation.",args:[["result","Completed DescriptiveProfile."]],example:"client.display_descriptive_profile(profile)",api:null},
{name:"present_visualization",summary:"Build a bounded chart view.",description:"Returns VisualizationPresentation. SVG rendering uses only bounded API points and shows platform truncation/approximation flags.",args:[["result","VisualizationResult from visualize_dataset."]],example:"view = client.present_visualization(chart)\ndisplay(view)",api:null},
{name:"display_visualization",summary:"Display the bounded chart view.",description:"Uses IPython display when available; otherwise prints a concise terminal summary.",args:[["result","VisualizationResult from visualize_dataset."]],example:"client.display_visualization(chart)",api:null},
{name:"present_time_series_analysis",summary:"Build a temporal-diagnostics view.",description:"Returns TimeSeriesAnalysisPresentation with full-scan scope, summary metrics, and quality notes.",args:[["result","Completed TimeSeriesAnalysis."]],example:"view = client.present_time_series_analysis(diagnostics)\ndisplay(view)",api:null},
{name:"display_time_series_analysis",summary:"Display temporal diagnostics.",description:"Uses IPython display when available; otherwise prints a concise terminal summary.",args:[["result","Completed TimeSeriesAnalysis."]],example:"client.display_time_series_analysis(diagnostics)",api:null}]}
],
notebook:"../../examples/API-usage/Example01_master.ipynb",notebookLabel:"Open the nearest end-to-end notebook →",notebookText:"No dedicated Analysis notebook has been added. Use this reference with the nearest end-to-end notebook, then build your own Analysis walkthrough step by step."
